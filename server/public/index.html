<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科贸小鱼 · 管理后台</title>
<style>
  :root{
    --brand:#FF7043; --brand-d:#E85A2C; --brand-l:#FFF1EC;
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#1F2937; --ink-2:#4B5563; --muted:#9099A8;
    --line:#E8EAEE; --ok:#12A594; --warn:#E5A100; --danger:#E5484D; --info:#3B82F6;
    --r:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  a{color:var(--brand-d);text-decoration:none}

  /* ---------- 通用 ---------- */
  .btn{padding:7px 14px;border-radius:8px;background:var(--brand);color:#fff;font-weight:500;transition:.15s}
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:#F9FAFB;color:var(--ink)}
  .btn.sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #F5D0D1}
  .btn.danger:hover{background:#FEF2F2}
  .btn.ok{background:#fff;color:var(--ok);border:1px solid #C7E9E4}
  .btn.ok:hover{background:#F0FBF9}
  .inp,select.inp{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;transition:.15s}
  .inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:10px}
  .wrap{display:flex;flex-wrap:wrap;gap:10px}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #F1F3F6;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FBFBFC}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
  .t-on{background:#E9F9F5;color:#0E8A7B} .t-off{background:#F3F4F6;color:#6B7280}
  .t-sold{background:#EEF2FF;color:#4F46E5} .t-reviewing{background:#FFF7E6;color:#B47800}
  .t-pending{background:#FFF7E6;color:#B47800} .t-paid{background:#EEF2FF;color:#4F46E5}
  .t-shipped{background:#E8F1FF;color:#1D4ED8} .t-done{background:#E9F9F5;color:#0E8A7B}
  .t-canceled{background:#F3F4F6;color:#6B7280} .t-refunding{background:#FEF2F2;color:#C0362C}
  .t-refunded{background:#F3F4F6;color:#6B7280} .t-handled{background:#E9F9F5;color:#0E8A7B}
  .t-banned{background:#FEF2F2;color:#C0362C}
  /* 内容侧（校园墙 / 学习资源 / 拼团）的状态标签 */
  .t-hidden{background:#FEF2F2;color:#C0362C} .t-open{background:#E9F9F5;color:#0E8A7B}
  .t-success{background:#EEF2FF;color:#4F46E5} .t-failed{background:#F3F4F6;color:#6B7280}
  .t-deleted{background:#F3F4F6;color:#6B7280}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#F3F4F6;flex:0 0 auto;cursor:zoom-in}
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- 登录 ---------- */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#FFF6F2 0%,#F4F5F7 46%,#EEF2FF 100%)}
  .login-card{width:380px;padding:34px 32px;background:#fff;border-radius:16px;
    box-shadow:0 12px 40px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.04);border:1px solid #fff}
  .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#FF9A6C);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;
    box-shadow:0 6px 16px rgba(255,112,67,.32)}
  .login-card h1{margin:0 0 4px;font-size:20px;letter-spacing:-.2px}
  .login-card p.sub{margin:0 0 24px;color:var(--muted);font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
  .field .inp{width:100%}
  #loginErr{margin-top:12px;padding:9px 12px;border-radius:8px;background:#FEF2F2;color:#C0362C;font-size:13px}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

  /* ---------- 主框架 ---------- */
  #app{display:flex;min-height:100%}
  aside{width:212px;flex:0 0 212px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;font-weight:600;font-size:15px;letter-spacing:-.2px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#FF9A6C);
    display:flex;align-items:center;justify-content:center;font-size:14px}
  nav{padding:6px 10px;overflow-y:auto;flex:1}
  nav button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;
    color:var(--ink-2);font-size:13.5px;text-align:left;margin-bottom:2px;transition:.13s}
  nav button:hover{background:#F7F8FA;color:var(--ink)}
  nav button.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
  nav .ico{width:18px;text-align:center;font-size:15px}
  nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:600;
    padding:1px 6px;border-radius:20px;line-height:1.5}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .side-foot b{color:var(--ink-2);display:block;margin-bottom:2px}
  .src-badge{display:inline-flex;align-items:center;gap:5px;margin-bottom:5px;
    background:#FAEEDA;color:#854F0B;font-size:11.5px;font-weight:500;
    padding:2px 8px;border-radius:20px;cursor:help}
  .src-badge .dot2{width:6px;height:6px;border-radius:50%;background:#EF9F27;flex:0 0 6px}

  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:58px;flex:0 0 58px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;
    position:sticky;top:0;z-index:10}
  header h2{margin:0;font-size:16.5px;letter-spacing:-.2px}
  header .grow{flex:1}
  /* 数据源徽标：云端=绿，本地=橙。让人一眼知道看的是不是线上真实数据 */
  .src-badge{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;
    border:1px solid transparent;white-space:nowrap;cursor:default}
  .src-badge.cloud{color:#0B7A46;background:#E7F8EF;border-color:#BFEAD3}
  .src-badge.local{color:#A3651A;background:#FFF6E6;border-color:#F2DDB8}
  .src-badge.loading{color:#697;background:#F2F4F7;border-color:#E3E6EA}
  .upd{font-size:12px;color:#8A929C;white-space:nowrap}
  .auto-tg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#5A626C;
    cursor:pointer;user-select:none;white-space:nowrap}
  .auto-tg input{margin:0;cursor:pointer}
  #view{padding:20px 22px 40px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .stat{padding:16px 18px}
  .stat .k{color:var(--muted);font-size:12.5px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:25px;font-weight:650;letter-spacing:-.6px;line-height:1.15}
  .stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
  .sec-h h3{margin:0;font-size:14.5px;font-weight:600}
  .sec-h .grow{flex:1}
  .chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:16px 18px 10px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .chart .bar{width:100%;max-width:34px;background:linear-gradient(180deg,#FF9066,var(--brand));
    border-radius:5px 5px 2px 2px;min-height:3px;transition:.3s}
  .chart .bar.zero{background:#EFF1F4}
  .chart .lb{font-size:11.5px;color:var(--muted)}
  .zone{display:flex;align-items:center;gap:10px;padding:8px 0}
  .zone .n{width:78px;flex:0 0 78px;font-size:13px}
  .zone .t{flex:1;height:7px;background:#F1F3F6;border-radius:20px;overflow:hidden}
  .zone .t i{display:block;height:100%;background:linear-gradient(90deg,#FFA57C,var(--brand));border-radius:20px}
  .zone .c{width:34px;text-align:right;font-size:12.5px;color:var(--muted)}
  .page-foot{display:flex;align-items:center;gap:10px;padding:12px 2px 0;color:var(--muted);font-size:13px}
  .page-foot .grow{flex:1}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  #toast div{background:#1F2937;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(16,24,40,.2);animation:up .22s ease-out}
  #toast div.err{background:#C0362C} #toast div.ok{background:#0E8A7B}
  @keyframes up{from{opacity:0;transform:translateY(8px)}}
  .form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .form-row .f{display:flex;flex-direction:column;gap:6px}
  .form-row label{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .issue{padding:14px 16px;border-bottom:1px solid #F1F3F6}
  .issue:last-child{border-bottom:0}
  .issue .top{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
  .issue .body{flex:1;min-width:0}
  .issue .ttl{font-weight:600;font-size:13.5px;margin-bottom:2px}
  .issue .why{font-size:13px;color:var(--ink-2)}
  .switch{position:relative;width:42px;height:24px;flex:0 0 42px}
  .switch input{opacity:0;width:0;height:0}
  .switch i{position:absolute;inset:0;background:#D7DBE2;border-radius:20px;transition:.2s}
  .switch i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked+i{background:var(--ok)}
  .switch input:checked+i:before{transform:translateX(18px)}
  @media(max-width:820px){
    aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.2s}
    aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.16)}
    #view{padding:16px 14px 40px} header{padding:0 14px}
  }

/* ---------- 图片预览 ---------- */
#imgView {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0, 0, 0, 0.86);
  display: flex; align-items: center; justify-content: center;
}
#imgView[hidden] { display: none; }
#imgView img {
  max-width: 92vw; max-height: 86vh; object-fit: contain;
  border-radius: 10px; background: #111;
}
.iv-btn {
  position: fixed; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, 0.14); color: #fff;
  border-radius: 999px; font-size: 22px; line-height: 1;
  width: 44px; height: 44px;
}
.iv-btn:hover { background: rgba(255, 255, 255, 0.26); }
.iv-close { top: 18px; right: 20px; font-size: 26px; }
.iv-prev { left: 18px; top: 50%; transform: translateY(-50%); }
.iv-next { right: 18px; top: 50%; transform: translateY(-50%); }
.iv-count {
  position: fixed; bottom: 22px; left: 0; right: 0;
  text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 13px;
}
</style>
</head>
<body>

<!-- ========== 登录 ========== -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="logo">🏫</div>
    <h1>科贸小鱼 · 管理后台</h1>
    <p class="sub">校园生活服务与二手交易综合平台</p>
    <div class="field">
      <label>管理员账号</label>
      <input class="inp" id="u" value="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input class="inp" id="p" type="password" value="admin" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;padding:10px" id="loginBtn" type="submit">登录</button>
    <div id="loginErr" hidden></div>
    <div class="hint" id="loginHint">科贸小鱼运营管理端 · 仅授权管理员可登录</div>
  </form>
</div>

<!-- ========== 主界面 ========== -->
<div id="app" hidden>
  <aside>
    <div class="brand"><span class="dot">🏫</span><span>科贸小鱼后台</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b id="whoami">—</b>
      <div class="src-badge" id="sideSource" title="当前数据来源">
        <span class="dot2"></span><span class="txt">数据源：检测中…</span>
      </div>
      <span id="envInfo" class="muted"></span>
      <button class="btn ghost sm" style="margin-top:8px;width:100%" id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <main>
    <header>
      <button class="btn ghost sm" id="menuBtn" style="display:none">☰</button>
      <h2 id="title">仪表盘</h2>
      <span class="src-badge" id="srcBadge" title="当前数据来源">数据源：…</span>
      <span class="grow"></span>
      <span class="upd" id="updAt"></span>
      <label class="auto-tg" title="开启后每 5 秒自动刷新；你正在填写表单时会自动暂停">
        <input type="checkbox" id="autoChk" checked><span>自动刷新</span>
      </label>
      <button class="btn ghost sm" id="reloadBtn">刷新</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<!-- 图片预览层：点缩略图后**在原地看大图**，不依赖浏览器打开新标签 -->
<div id="imgView" hidden>
  <img id="imgViewImg" alt="">
  <button class="iv-btn iv-close" id="ivClose">×</button>
  <button class="iv-btn iv-prev" id="ivPrev">‹</button>
  <button class="iv-btn iv-next" id="ivNext">›</button>
  <div class="iv-count" id="ivCount"></div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ==================== 基础工具 ==================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
/** 分 -> ¥字符串（后端金额单位是「分」） */
const yuan = (fen) => '¥' + (Math.round(Number(fen) || 0) / 100).toFixed(2);
const num  = (n) => (Number(n) || 0).toLocaleString('zh-CN');

function toast(msg, kind) {
  const d = document.createElement('div');
  if (kind) d.className = kind;
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = '.3s'; }, 1900);
  setTimeout(() => d.remove(), 2300);
}


/* ==================== 图片预览 ====================
 * 为什么不用 window.open：云存储的临时链接响应头带了
 * content-disposition: attachment，浏览器会把它当附件下载，
 * 于是「点图就下载」而不是看图。<img> 渲染不受这个头影响，
 * 所以在页内做个遮罩层展示，最稳、也不弹新标签。
 */
const ImgView = {
  urls: [],
  i: 0,
  show(urls, i) {
    this.urls = (urls || []).filter(Boolean);
    if (!this.urls.length) return;
    this.i = Math.max(0, Math.min(Number(i) || 0, this.urls.length - 1));
    this.render();
    document.getElementById('imgView').hidden = false;
  },
  render() {
    const img = document.getElementById('imgViewImg');
    img.src = this.urls[this.i] || '';
    document.getElementById('ivCount').textContent =
      this.urls.length > 1 ? (this.i + 1) + ' / ' + this.urls.length : '';
    const multi = this.urls.length > 1;
    document.getElementById('ivPrev').style.display = multi ? '' : 'none';
    document.getElementById('ivNext').style.display = multi ? '' : 'none';
  },
  prev() { if (!this.urls.length) return; this.i = (this.i - 1 + this.urls.length) % this.urls.length; this.render(); },
  next() { if (!this.urls.length) return; this.i = (this.i + 1) % this.urls.length; this.render(); },
  hide() {
    document.getElementById('imgView').hidden = true;
    document.getElementById('imgViewImg').src = '';
  }
};

document.addEventListener('DOMContentLoaded', () => {
  const box = document.getElementById('imgView');
  if (!box) return;
  box.onclick = () => ImgView.hide();
  document.getElementById('imgViewImg').onclick = (e) => e.stopPropagation();
  document.getElementById('ivClose').onclick = (e) => { e.stopPropagation(); ImgView.hide(); };
  document.getElementById('ivPrev').onclick = (e) => { e.stopPropagation(); ImgView.prev(); };
  document.getElementById('ivNext').onclick = (e) => { e.stopPropagation(); ImgView.next(); };
  document.addEventListener('keydown', (e) => {
    if (box.hidden) return;
    if (e.key === 'Escape') ImgView.hide();
    if (e.key === 'ArrowLeft') ImgView.prev();
    if (e.key === 'ArrowRight') ImgView.next();
  });
});


/* ==================== 列表缩略图 ====================
 * 所有列表里的图都走这里：最多 3 张、点开在页内看大图。
 * 之前是「直接 window.open」→ 云存储响应头是 attachment，
 * 浏览器当附件下载；<img> 不受影响，所以在页内预览最稳。
 */
const THUMB_MAP = {};
function thumbRow(images, id) {
  const imgs = (images || []).filter(Boolean);
  if (!imgs.length) return '<span class="muted">—</span>';
  THUMB_MAP[id] = imgs;
  return imgs.slice(0, 3).map((u, i) =>
    '<img class="thumb" src="' + esc(u) + '" data-cid="' + id + '" data-i="' + i + '"' +
    ' style="margin-right:4px" onerror="this.style.visibility=\'hidden\'">'
  ).join('');
}
/** 渲染完页面后统一绑定：有 data-cid 用整组图，没有就单图预览 */
function bindThumbs() {
  document.querySelectorAll('#view .thumb').forEach((im) => {
    const cid = im.getAttribute('data-cid');
    if (cid !== null) {
      im.onclick = () => ImgView.show(THUMB_MAP[cid] || [], Number(im.getAttribute('data-i')) || 0);
    } else {
      const u = im.getAttribute('src');
      if (u) im.onclick = () => ImgView.show([u], 0);
    }
  });
}

/* ==================== API ==================== */
const API = {
  token: '',
  async req(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (this.token) headers.Authorization = 'Bearer ' + this.token;
    const res = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let j = {};
    try { j = await res.json(); } catch (e) { }
    // ⚠️ 两种模式下「未登录/已过期」的表示方式不同：
    //   本地模式 → 本地服务自己返回真 HTTP 401；
    //   云端模式 → /admin-api/* 被透传给云函数，统一 json(res, 200, out)，
    //              HTTP 恒为 200，业务结果全在 body.code 里（code:401）。
    // 所以只判 res.status 的话，**云端模式下会话失效永远不会跳回登录页** ——
    // 用户会停在满是旧数据的后台，反复点、反复弹「请先登录管理后台」却出不去。
    //
    // 但登录接口本身失败（密码错）也是 code:401，那不该被当成「会话过期」
    // （否则会提示错误的文案并触发一次多余的 logout），所以按路径排除。
    const isLogin = path.indexOf('/admin-api/login') === 0;
    if (res.status === 401 || (!isLogin && j.code === 401)) {
      App.logout(); throw new Error(j.message || '登录已过期，请重新登录');
    }
    if (!res.ok || j.code !== 0) throw new Error(j.message || ('请求失败（HTTP ' + res.status + '）'));
    return j.data;
  },
  get(p) { return this.req('GET', p); },
  post(p, b) { return this.req('POST', p, b || {}); },
  put(p, b) { return this.req('PUT', p, b || {}); },
  del(p) { return this.req('DELETE', p); }
};

function pager(p, onGo) {
  const total = p.total || 0, size = p.pageSize || 12, cur = p.page || 1;
  const pages = Math.max(1, Math.ceil(total / size));
  if (pages <= 1) return '';
  return '<div class="page-foot">共 ' + total + ' 条 · 第 ' + cur + '/' + pages + ' 页' +
    '<span class="grow"></span>' +
    '<button class="btn ghost sm" data-go="' + (cur - 1) + '"' + (cur <= 1 ? ' disabled' : '') + '>上一页</button>' +
    '<button class="btn ghost sm" data-go="' + (cur + 1) + '"' + (cur >= pages ? ' disabled' : '') + '>下一页</button>' +
    '</div>';
}
/** 给 pager 生成的按钮挂事件（因为 innerHTML 重建了 DOM） */
function bindPager(fn) {
  $$('#view [data-go]').forEach((b) => {
    b.onclick = () => fn(Number(b.getAttribute('data-go')));
  });
}

    $('#pSave').onclick = async () => {
      const oldPwd = $('#pOld').value, pwd = $('#pNew').value, pwd2 = $('#pNew2').value;

      try {

        toast('密码已修改' + (r && r.killed ? '，其它设备已退出登录' : ''), 'ok');
        $('#pOld').value = $('#pNew').value = $('#pNew2').value = '';
        $('#pwdHint').textContent = '下次登录请用新密码';

      } catch (e) { toast(e.message, 'err'); b.disabled = false; }

};

/* ==================== 启动 ==================== */
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.hidden = true; btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    await App.login($('#u').value.trim(), $('#p').value);
  } catch (ex) {
    err.textContent = ex.message || '登录失败';
    err.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
};
$('#logoutBtn').onclick = () => App.logout();
$('#reloadBtn').onclick = () => { Auto.clearDirty(); App.reload(); };
$('#menuBtn').onclick = () => $('#nav').classList.toggle('open');

/* ==================== 自动刷新 ==================== */
/**
 * 每 5 秒静默重拉当前视图。
 *
 * 三道保护，避免自动刷新帮倒忙：
 *   1) 页面在后台（document.hidden）不刷 —— 省流量、省云函数调用
 *   2) 未登录不刷
 *   3) **用户正在填表单时不刷**：视图里有输入框（筛选关键词、公告标题/正文、
 *      AI 配置等），无脑重渲染会把用户正在敲的内容冲掉。
 *      用 dirty 标记（视图内发生过 input 事件）+ 焦点检测双重判断。
 */
const Auto = {
  timer: null,
  everyMs: 5000,
  on: true,
  dirty: false,

  init() {
    try { this.on = (localStorage.getItem('campus_admin_auto') || '1') === '1'; } catch (e) { }
    const chk = $('#autoChk');
    if (chk) {
      chk.checked = this.on;
      chk.onchange = () => {
        this.on = chk.checked;
        try { localStorage.setItem('campus_admin_auto', this.on ? '1' : '0'); } catch (e) { }
        this.schedule();
      };
    }
    // 视图内一有输入就标记 dirty（捕获阶段，任何输入框都算）
    document.addEventListener('input', (e) => {
      const v = $('#view');
      if (v && v.contains(e.target)) this.dirty = true;
    }, true);
    // 回到前台立刻刷一次，用户切回来就能看到最新的
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) this.tick(true);
    });
    this.schedule();
  },

  schedule() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (!this.on) return;
    this.timer = setInterval(() => this.tick(false), this.everyMs);
  },

  /** 退出登录时停掉（不要再打 401） */
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  /** 手动刷新/切换视图后调用：解除 dirty，并立刻重排下一次自动刷新 */
  clearDirty() { this.dirty = false; this.schedule(); },

  markRefreshed() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    const el = $('#updAt');
    if (el) el.textContent = '更新于 ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },

  async tick(force) {
    if (!this.on) return;
    if (document.hidden && !force) return;
    if (!API.token) return;                       // 未登录
    if (this.dirty && !force) return;             // 用户正在填表单
    const ae = document.activeElement;
    const v = $('#view');
    if (ae && v && v.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && !force) return;
    if (!$('#app') || $('#login') && !$('#login').hidden && !force) return;  // 还在登录页
    try { await App.reload(true); } catch (e) { /* 已有兜底 */ }
  }
};

/* ==================== 数据源徽标 ==================== */
/**
 * 显示「云端 / 本地」——直接回答「为什么后台数据和小程序对不上」。
 * 该接口由本地服务直接提供（不经过 /admin-api 代理），所以永远反映真实来源。
 */
let SITE_INFO = {};

async function loadSource() {
  const el = $('#srcBadge');
  const side = $('#sideSource .txt');
  try {
    const r = await fetch('/admin-info');
    const d = await r.json();
    SITE_INFO = d || {};
    if (d && d.source === 'cloud') {
      if (el) {
        el.className = 'src-badge cloud';
        el.textContent = '数据源：云端（线上真实数据）';
        el.title = '环境 ' + d.envId + ' · 云函数 ' + d.fn + (d.keyHint ? ' · Key ' + d.keyHint : '') +
          '\n这里看到并操作的就是小程序线上数据。';
      }
      if (side) side.textContent = '云端 · 线上数据';
    } else {
      if (el) {
        el.className = 'src-badge local';
        el.textContent = '数据源：本地演示数据';
        el.title = '当前读的是 server/data/db.json（本地种子数据），与小程序线上数据是两套。' +
          '\n此处的操作不会影响线上。要接线上：在 server/.cloudbase.json 填入 API Key 后重启服务。';
      }
      if (side) side.textContent = '本地 · 演示数据';
    }
    // 登录页提示：顺手告诉用户「同一 WiFi 下用哪个地址进来」
    const hint = $('#loginHint');
    if (hint && d && d.lanEnabled && (d.lanUrls || []).length) {
      hint.innerHTML = '科贸小鱼运营管理端 · 同一 WiFi 可用 ' +
        d.lanUrls.map(function (u) { return '<code>' + esc(u) + '</code>'; }).join(' / ') + ' 打开';
    }
  } catch (e) {
    if (el) { el.className = 'src-badge loading'; el.textContent = '数据源：未知'; }
    if (side) side.textContent = '数据源未知';
  }
}

// 已有 token 就直接进入（失效会自动退回登录页）
(async () => {
  await loadSource();
  let t = '';
  try { t = localStorage.getItem('campus_admin_token') || ''; } catch (e) { }
  if (!t) return;
  API.token = t;
  try { await App.boot(); Auto.init(); } catch (e) { /* token 失效，保持登录页 */ }
})();
</script>
